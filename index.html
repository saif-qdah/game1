<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تخمين الرقم السري</title>
    <style>
        /* ستايل اللعبة */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px rgba(255, 255, 255, 0.2) solid;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-bottom: 10px; font-size: 28px; }
        p { font-size: 16px; color: #e0e0e0; }
        input {
            padding: 12px;
            font-size: 18px;
            width: 80px;
            text-align: center;
            border: none;
            border-radius: 8px;
            margin: 20px 0;
            outline: none;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #ff9f43;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #ee5253; transform: scale(1.05); }
        .message { font-size: 18px; margin-top: 20px; font-weight: bold; min-height: 27px; }
        .attempts { color: #10ac84; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>خمن الرقم السري 🧠</h1>
        <p>الكمبيوتر اختار رقم بين 1 و 100. بتقدر تحزره؟</p>
        
        <input type="number" id="guess-input" min="1" max="100" placeholder="؟">
        <br>
        <button id="guess-btn">تخمين!</button>

        <div class="message" id="message-text"></div>
        <div class="attempts" id="attempts-text">عدد المحاولات: 0</div>
    </div>

    <!-- ربط الجافا سكريبت -->
    <script src="script.js"></script>
</body>
</html>
